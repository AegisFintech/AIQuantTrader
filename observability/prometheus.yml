global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: aiquanttrader-market-data
    static_configs:
      - targets: ["market-data-recorder:9109"]
  - job_name: aiquanttrader-execution
    static_configs:
      - targets: ["trading-node:9110"]
  - job_name: aiquanttrader-sentinel
    static_configs:
      - targets: ["safety-sentinel:9111"]
  - job_name: aiquanttrader-paper
    static_configs:
      - targets: ["paper-trader:9112"]
  - job_name: aiquanttrader-shadow-gateway
    static_configs:
      - targets: ["shadow-gateway:9109"]
  - job_name: aiquanttrader-shadow
    static_configs:
      - targets: ["shadow-observer:9113"]
