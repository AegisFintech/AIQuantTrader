[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "aiquanttrader-native"
version = "0.1.0"
description = "Linux-native AIQuantTrader domain, configuration, and safety foundation"
readme = "README.md"
requires-python = "==3.12.*"
license = {text = "MIT"}
authors = [{name = "Aegis Fintech"}]
dependencies = [
  "duckdb==1.5.4",
  "hftbacktest==2.4.4",
  "hyperliquid-python-sdk==0.24.0",
  "nautilus-trader==1.230.0",
  "numpy==2.2.6",
  "prometheus-client==0.25.0",
  "pycryptodome==3.23.0",
  "pyarrow==25.0.0",
  "pydantic==2.13.4",
  "websockets==17.0.1",
  "zstandard==0.25.0",
]

[project.optional-dependencies]
research = [
  "catboost==1.2.10",
  "lightgbm==4.7.0",
  "xgboost-cpu==3.3.0",
]

[project.scripts]
aqt-native = "aiquanttrader_native.cli:main"
aqt-backtest = "aiquanttrader_native.backtest.cli:main"
aqt-research = "aiquanttrader_native.research.cli:main"
aqt-market-data = "aiquanttrader_native.market_data.cli:main"
aqt-execution = "aiquanttrader_native.execution.cli:main"
aqt-sentinel = "aiquanttrader_native.sentinel.cli:main"
aqt-paper = "aiquanttrader_native.paper.cli:main"
aqt-shadow = "aiquanttrader_native.shadow.cli:main"
aqt-governance = "aiquanttrader_native.governance.cli:main"
aqt-acceptance = "aiquanttrader_native.acceptance.cli:main"

[dependency-groups]
dev = [
  "mypy==2.3.0",
  "pip-audit>=2.9,<3",
  "pytest==9.1.1",
  "pytest-cov>=7,<8",
  "ruff==0.15.22",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aiquanttrader_native"]

[tool.uv]
required-version = "==0.11.29"
package = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["aiquanttrader_native"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "PTH", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["hftbacktest", "hftbacktest.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["catboost", "catboost.*", "lightgbm", "lightgbm.*", "xgboost", "xgboost.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["nautilus_trader", "nautilus_trader.*", "hyperliquid", "hyperliquid.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["Crypto", "Crypto.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
