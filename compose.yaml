name: aiquanttrader-native

services:
  foundation:
    image: aiquanttrader-native-foundation:0.1.0
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - serve-health
      - --config-dir
      - /etc/aiquanttrader-native
      - --environment
      - ${AQT_NATIVE_ENVIRONMENT:-paper}
    user: "65532:65532"
    read_only: true
    init: true
    restart: unless-stopped
    stop_grace_period: 10s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - native-data:/var/lib/aiquanttrader/data
      - native-state:/var/lib/aiquanttrader/state
    ports:
      - "127.0.0.1:9108:9108"
    healthcheck:
      test:
        - CMD
        - aqt-native
        - healthcheck
        - --url
        - http://127.0.0.1:9108/health/ready
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m

  market-data-recorder:
    profiles: ["market-data"]
    image: aiquanttrader-native-foundation:0.1.0
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["aqt-market-data"]
    command:
      - record
      - --config-dir
      - /etc/aiquanttrader-native
      - --environment
      - ${AQT_NATIVE_ENVIRONMENT:-paper}
    user: "65532:65532"
    read_only: true
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - native-data:/var/lib/aiquanttrader/data
      - native-state:/var/lib/aiquanttrader/state
    ports:
      - "127.0.0.1:9109:9109"
    healthcheck:
      test:
        - CMD
        - aqt-market-data
        - healthcheck
        - --state-root
        - /var/lib/aiquanttrader/state
        - --stale-after-seconds
        - "30"
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m

  market-data-normalizer:
    profiles: ["market-data"]
    image: aiquanttrader-native-foundation:0.1.0
    entrypoint: ["aqt-market-data"]
    command:
      - normalize-pending
      - --data-root
      - /var/lib/aiquanttrader/data
      - --state-root
      - /var/lib/aiquanttrader/state
      - --poll-seconds
      - "5"
    user: "65532:65532"
    read_only: true
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - native-data:/var/lib/aiquanttrader/data
      - native-state:/var/lib/aiquanttrader/state
    healthcheck:
      test:
        - CMD
        - aqt-market-data
        - normalizer-healthcheck
        - --state-root
        - /var/lib/aiquanttrader/state
        - --stale-after-seconds
        - "120"
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m

  paper-trader:
    profiles: ["paper"]
    image: aiquanttrader-native-paper:0.1.0
    build:
      context: .
      dockerfile: Dockerfile
      target: paper
    entrypoint: ["aqt-paper"]
    command:
      - run
      - --config-dir
      - /etc/aiquanttrader-native
      - --environment
      - paper
      - --code-identity
      - ${AQT_NATIVE_CODE_IDENTITY:-unreviewed-local}
    user: "65532:65532"
    read_only: true
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - native-data:/var/lib/aiquanttrader/data
      - native-state:/var/lib/aiquanttrader/state
      - ${AQT_OPENAI_API_KEY_FILE:-/dev/null}:/run/secrets/openai_api_key:ro
    ports:
      - "127.0.0.1:9112:9112"
    healthcheck:
      test:
        - CMD
        - aqt-paper-healthcheck
        - --state-root
        - /var/lib/aiquanttrader/state
        - --stale-after-ms
        - "5000"
        - --mode
        - liveness
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m

  node-exporter:
    profiles: ["monitoring"]
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)($$|/)
    user: "65532:65532"
    read_only: true
    init: true
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    healthcheck:
      test: ["CMD", "/bin/node_exporter", "--version"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m

  research-readiness:
    profiles: ["monitoring"]
    image: aiquanttrader-native-readiness:0.1.0
    build:
      context: .
      dockerfile: Dockerfile
      target: readiness
    entrypoint: ["python", "-m", "aiquanttrader.research_readiness_cli"]
    command:
      - serve
      - --data-root
      - /var/lib/aiquanttrader/data
      - --state-root
      - /var/lib/aiquanttrader/state
      - --policy
      - /etc/aiquanttrader-native/research/data-readiness-v1.toml
      - --validation-policy
      - /etc/aiquanttrader-native/backtest/validation-v1.toml
      - --poll-seconds
      - "60"
      - --metrics-port
      - "9114"
    user: "65532:65532"
    read_only: true
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - native-data:/var/lib/aiquanttrader/data:ro
      - native-state:/var/lib/aiquanttrader/state
    ports:
      - "127.0.0.1:9114:9114"
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - aiquanttrader.research_readiness_healthcheck
        - --state-root
        - /var/lib/aiquanttrader/state
        - --stale-after-seconds
        - "180"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.13.0-distroless@sha256:f3b6aae627d96e7ad8256cdf6de5953247735117c6f577383fadb42efeeea7bc
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=256MB
    user: "65532:65532"
    read_only: true
    init: true
    restart: unless-stopped
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "/bin/promtool", "check", "healthy"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:13.1.0@sha256:121a7a9ece6dc10b969f1f96eed64b4f07dfac0d0b8abc070f7cb83bbde86f63
    environment:
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/paper-trading.json
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PATHS_LOGS: /tmp/grafana-logs
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    user: "472:0"
    read_only: true
    init: true
    restart: unless-stopped
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m

volumes:
  native-data:
    name: aiquanttrader-native-data
  native-state:
    name: aiquanttrader-native-state
  prometheus-data:
    name: aiquanttrader-prometheus-data
  grafana-data:
    name: aiquanttrader-grafana-data
