config_version = 1
environment = "base"
mode = "research"

[instrument]
venue = "HYPERLIQUID"
instrument_id = "BTC-USD-PERP.HYPERLIQUID"
raw_symbol = "BTC"

[exchange]
network = "testnet"
http_url = "https://api.hyperliquid-testnet.xyz"
websocket_url = "wss://api.hyperliquid-testnet.xyz/ws"

[execution]
enabled = false
max_inflight_requests = 20
reconcile_on_startup = true
unknown_order_timeout_ms = 5000
approval_ttl_ms = 250
heartbeat_interval_ms = 1000
adapter_http_timeout_seconds = 10
adapter_ws_post_timeout_seconds = 10
normalize_prices = true
include_builder_attribution = false

[live_strategy]
enabled = false
strategy_id = "order-flow-scalper-v1"
feature_config_path = "features/microstructure-v1.toml"
strategy_config_path = "strategies/order-flow-scalper-v1.toml"
estimated_taker_fee_bps = "4.5"
estimated_slippage_bps = "1"

[sentinel]
enabled = false
poll_interval_ms = 1000
heartbeat_stale_after_ms = 5000
deadman_timeout_ms = 20000
deadman_renew_interval_ms = 5000
cancel_retry_count = 3
metrics_host = "0.0.0.0"
metrics_port = 9111

[market_data]
enabled = false
public_channels = ["l2Book", "trades", "bbo", "activeAssetCtx"]
segment_duration_seconds = 3600
sync_every_records = 100
stale_after_seconds = 15
ping_interval_seconds = 30
max_frame_bytes = 8388608
reconnect_initial_ms = 250
reconnect_max_ms = 5000
reconnect_jitter_fraction = "0.2"
outbound_messages_per_minute = 120
minimum_free_bytes = 5368709120
minimum_free_fraction = "0.10"
metrics_host = "0.0.0.0"
metrics_port = 9109

[paper]
enabled = false
strategy_id = "order-flow-scalper-v1"
scenario_path = "paper/baseline-v1.toml"
sensitivity_scenario_paths = ["paper/pessimistic-v1.toml"]
feature_config_path = "features/microstructure-v1.toml"
strategy_config_path = "strategies/order-flow-scalper-v1.toml"
evidence_policy_path = "paper/evidence-v1.toml"
initial_equity_usd = "100000"
watchdog_interval_ms = 250
status_stale_after_ms = 5000
markout_horizon_ms = 1000
metrics_host = "0.0.0.0"
metrics_port = 9112

[paper.llm_confirmation]
enabled = false
mode = "shadow_only"
model = "gpt-5.6-terra"
api_key_secret_path = "/run/secrets/openai_api_key"
minimum_request_interval_seconds = 60
timeout_seconds = 10
maximum_output_tokens = 300
queue_capacity = 4

[shadow]
enabled = false
strategy_id = "order-flow-scalper-v1"
scenario_path = "paper/baseline-v1.toml"
sensitivity_scenario_paths = ["paper/pessimistic-v1.toml"]
feature_config_path = "features/microstructure-v1.toml"
strategy_config_path = "strategies/order-flow-scalper-v1.toml"
engine_policy_path = "paper/evidence-v1.toml"
evidence_policy_path = "shadow/evidence-v1.toml"
initial_equity_usd = "100000"
watchdog_interval_ms = 250
health_sample_interval_ms = 1000
ingress_poll_interval_ms = 10
ingress_batch_size = 100
maximum_ingress_lag_ms = 1500
maximum_clock_skew_ms = 250
status_stale_after_ms = 5000
markout_horizon_ms = 1000
metrics_port = 9113

[risk]
daily_loss_fraction = "0.005"
max_drawdown_fraction = "0.01"
max_leverage = "1.0"
max_order_size_base = "0.005"
max_position_size_base = "0.02"
max_order_notional_usd = "250"
max_inventory_notional_usd = "1000"
max_open_orders = 4
max_orders_per_second = 5
max_cancels_per_second = 10
public_data_stale_after_ms = 1500
private_data_stale_after_ms = 3000

[storage]
data_root = "/var/lib/aiquanttrader/data"
state_root = "/var/lib/aiquanttrader/state"

[observability]
health_host = "0.0.0.0"
health_port = 9108
execution_metrics_host = "0.0.0.0"
execution_metrics_port = 9110

[approval]
